<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NeuroScan AI - Hệ thống phân tích khối u não bằng trí tuệ nhân tạo">
    <meta name="author" content="NeuroScan AI Team">
    <title>NeuroScan AI | Brain Tumor Classification System</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/predict.css">
    <link rel="stylesheet" href="css/model.css">
    <link rel="stylesheet" href="css/account.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>

<div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">
                <i class="fas fa-brain"></i>
            </div>
            <div class="logo-text">
                <span class="logo-title">NeuroScan</span>
                <span class="logo-subtitle">AI Medical Imaging</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-tab="home">
                <i class="fas fa-home"></i>
                <span>Trang chủ</span>
            </a>
            <a href="#" class="nav-item" data-tab="predict">
                <i class="fas fa-microscope"></i>
                <span>Dự đoán MRI</span>
            </a>
            <a href="#" class="nav-item" data-tab="model">
                <i class="fas fa-chart-line"></i>
                <span>Model & Metrics</span>
            </a>
            <a href="#" class="nav-item" data-tab="account">
                <i class="fas fa-user-circle"></i>
                <span>Tài khoản</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="system-status">
                <i class="fas fa-circle"></i>
                <span>System Online</span>
            </div>
            <div class="version">v2.0.0</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title" id="pageTitle">Dashboard</div>
            </div>
            <div class="header-right">
                <div id="authStatus" class="user-menu">
                    <div id="notLoggedInView" class="user-guest">
                        <i class="fas fa-user-circle"></i>
                        <span>Khách</span>
                    </div>
                    <div id="loggedInView" class="user-logged hidden">
                        <div class="user-avatar">
                            <i class="fas fa-user-md"></i>
                        </div>
                        <div class="user-info">
                            <span class="user-name" id="userNameDisplay">User</span>
                            <span class="user-role">Medical Professional</span>
                        </div>
                        <button class="logout-icon-btn" id="logoutIconBtn" title="Đăng xuất">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Tab Contents -->
        <div class="tab-content-wrapper">
            <!-- Home Tab -->
            <div id="homeTab" class="tab-pane active">
                <!-- Home content loaded dynamically -->
            </div>

            <!-- Predict Tab -->
            <div id="predictTab" class="tab-pane">
                <!-- Predict content loaded dynamically -->
            </div>

            <!-- Model Tab -->
            <div id="modelTab" class="tab-pane">
                <!-- Model content loaded dynamically -->
            </div>

            <!-- Account Tab -->
            <div id="accountTab" class="tab-pane">
                <!-- Account content loaded dynamically -->
            </div>
        </div>
    </main>
</div>

<!-- Scripts -->
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/predict.js"></script>
<script src="js/model.js"></script>
<script src="js/main.js"></script>
</body>
</html>
